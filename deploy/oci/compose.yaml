# Native local build for OCI Ampere A1 (linux/arm64), no registry image dependency.
# Run from repository root: docker compose --env-file .env -f deploy/oci/compose.yaml up -d --build
name: mytrips
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: mytrips:${MYTRIPS_VERSION:-0.1.0}
    platform: linux/arm64
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MYTRIPS_PORT:-8030}:8000"
    env_file:
      - ../../.env
    environment:
      DB_PATH: /app/data/mytrips.db
      DISABLE_SCHEDULER: "true"
      DISABLE_SMTP_SERVER: "true"
      PHOTON_URL: ""
      OLLAMA_URL: ""
      DEMO_MODE: "false"
      SECURE_COOKIES: "true"
    volumes:
      - ../../data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/pwa/manifest.json', timeout=5).close()"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 40s
