# P0 OCI deployment. Run from repository root using -f deploy/oci/compose.yaml.
name: mytrips
services:
  app:
    image: ${PARTIU_IMAGE:?Set digest-pinned PARTIU_IMAGE, e.g. ghcr.io/lurrnet/mytrips@sha256:...}
    platform: linux/arm64
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PARTIU_PORT:-8000}:8000"
    env_file:
      - ../../.env
    environment:
      DB_PATH: /app/data/partiu.db
      DISABLE_SCHEDULER: "true"
      DISABLE_SMTP_SERVER: "true"
      PHOTON_URL: ""
      OLLAMA_URL: ""
      DEMO_MODE: "false"
      SECURE_COOKIES: "true"
    volumes:
      - ../../data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/manifest.json', timeout=5).close()"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 40s
