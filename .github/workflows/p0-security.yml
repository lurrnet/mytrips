name: P0 deployment policy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check local-build deployment guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("docker-compose.yml").read_text()
          oci=Path("deploy/oci/compose.yaml").read_text()
          dockerfile=Path("Dockerfile").read_text()
          assert "build:" in root and "context: ." in root
          assert "build:" in oci and "context: ../.." in oci
          for s in (root,oci,dockerfile):
              assert "ghcr.io" not in s, "build/deploy must not depend on GHCR"
          for s in (root,oci):
              assert "image: mytrips:${MYTRIPS_VERSION:-0.1.0}" in s
              assert '127.0.0.1:${MYTRIPS_PORT:-8030}:8000' in s
              assert "PARTIU_PORT" not in s
              assert "25:2525" not in s and "2525:2525" not in s
              assert 'DISABLE_SMTP_SERVER: "true"' in s
              assert 'DISABLE_SCHEDULER: "true"' in s
              assert 'PHOTON_URL: ""' in s
              assert 'OLLAMA_URL: ""' in s
              assert 'DEMO_MODE: "false"' in s
              assert "DB_PATH: /app/data/mytrips.db" in s
          env_example=Path(".env.example").read_text()
          assert "MYTRIPS_PORT=8030" in env_example
          assert "PARTIU_PORT" not in env_example
          assert not Path(".github/workflows/build.yml").exists()
          assert not Path(".github/workflows/p0-arm64-build.yml").exists()
          print("P0 local build, no registry publish: PASS")
          PY

  backup-restore:
    name: Cold backup + restore drill (synthetic SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Provision disposable sample data
        run: |
          cat > .env <<'EOF'
          MYTRIPS_VERSION=0.1.0
          PARTIU_VERSION=2.6.9
          SECRET_KEY=ci-backup-synthetic-secret-please-do-not-use
          EOF
          mkdir -p data
          python3 - <<'PY'
          import sqlite3
          with sqlite3.connect("data/mytrips.db") as db:
              db.execute("create table restore_fixture (value text not null)")
              db.execute("insert into restore_fixture (value) values ('original')")
          PY
      - name: Validate resolved Compose policy
        run: bash deploy/oci/check-config.sh
      - name: Backup synthetic data
        env:
          PARTIU_BACKUP_DIR: ${{ runner.temp }}/mytrips-backup
        run: bash deploy/oci/backup.sh
      - name: Mutate and restore synthetic data
        env:
          PARTIU_BACKUP_DIR: ${{ runner.temp }}/mytrips-backup
        run: |
          python3 - <<'PY'
          import sqlite3
          with sqlite3.connect("data/mytrips.db") as db:
              db.execute("update restore_fixture set value = 'changed'")
          PY
          archive="$(find "$PARTIU_BACKUP_DIR" -name 'mytrips-*.tar.gz' -print -quit)"
          test -n "$archive"
          bash deploy/oci/restore.sh --apply "$archive"
          python3 - <<'PY'
          import sqlite3
          with sqlite3.connect("data/mytrips.db") as db:
              assert db.execute("select value from restore_fixture").fetchone() == ("original",)
          print("P0 synthetic cold backup/restore PASS")
          PY
