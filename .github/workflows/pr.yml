name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend tests & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check backend/

      - name: ty type check
        run: uv run ty check backend/

      - name: Run backend tests
        run: uv run pytest backend/tests/ -v --cov=backend --cov-report=xml --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: svelte-check (type check)
        run: npm run check
        working-directory: frontend

      - name: Vitest unit tests
        run: npm test
        working-directory: frontend

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install frontend dependencies & build
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start server
        run: |
          export SECRET_KEY="ci-test-secret-key-placeholder-32x"
          uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
        env:
          DISABLE_SCHEDULER: "true"

      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: frontend
        continue-on-error: true  # e2e tests may require seed data; don't block PRs

  pwa-browser:
    name: PWA Chromium runtime gate (required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: uv sync --frozen
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Chromium for runtime checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start local origin
        run: |
          SECRET_KEY="ci-test-secret-key-placeholder-32x" DISABLE_SCHEDULER=true \
            uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/mytrips-pwa-origin.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/pwa/install.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mytrips-pwa-origin.log
          exit 1
      - name: Test CSP, visible icon, worker scope and 404 in Chromium
        working-directory: frontend
        run: npx playwright test tests/pwa-install.spec.ts

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t mytrips:ci .

      - name: Smoke test (startup check)
        run: |
          docker run --rm -d \
            -p 127.0.0.1:8030:8000 \
            -e SECRET_KEY="ci-test-secret-key-placeholder-32x" \
            -e DISABLE_SCHEDULER="true" \
            --name mytrips_ci \
            mytrips:ci
          sleep 5
          docker logs mytrips_ci
          docker inspect mytrips_ci --format='{{.State.Running}}' | grep true
          python3 scripts/check_pwa_install.py --origin http://127.0.0.1:8030
          docker stop mytrips_ci
