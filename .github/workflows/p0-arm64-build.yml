name: P0 ARM64 pinned image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: mytrips-arm64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push reviewed ARM64 commit
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:p0-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=MyTrips
            org.opencontainers.image.version=0.1.0
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish immutable deploy reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          echo "PARTIU_IMAGE=${IMAGE_REF}" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'PARTIU_IMAGE=%s\n' "$IMAGE_REF" > deployment-image.env
      - uses: actions/upload-artifact@v4
        with:
          name: mytrips-arm64-image-ref
          path: deployment-image.env
          retention-days: 30
