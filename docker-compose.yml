# Self-hosted MyTrips: build locally. For OCI ARM64, prefer deploy/oci/compose.yaml.
name: mytrips
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mytrips:${MYTRIPS_VERSION:-0.1.0}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MYTRIPS_PORT:-8030}:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/mytrips.db
      DISABLE_SMTP_SERVER: "true"
      DISABLE_SCHEDULER: "true"
      PHOTON_URL: ""
      OLLAMA_URL: ""
      DEMO_MODE: "false"
      SECURE_COOKIES: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/pwa/manifest.json', timeout=5).close()"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 40s
